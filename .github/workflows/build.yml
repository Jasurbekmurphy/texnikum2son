name: Build

# main'ga har push qilinganda sayt build qilinadi va tayyor fayllar "dist" branchiga yoziladi.
# Contabo server shu branchni "git pull" qiladi, serverda Node.js kerak emas.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist branchiga yozish
        run: |
          cp deploy/update.sh dist/deploy-update.sh
          cp deploy/setup-admin.sh dist/setup-admin.sh
          mkdir -p dist/.server && cp -r server/pb_migrations server/pb_hooks dist/.server/
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
