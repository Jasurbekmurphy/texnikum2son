# /etc/nginx/sites-available/texnikum2son
# Sayt fayllari: /var/www/texnikum2son (GitHub'dagi "dist" branchi)
server {
    listen 80;
    listen [::]:80;
    server_name texnikum2son.com www.texnikum2son.com;

    root /var/www/texnikum2son;
    index index.html;

    # .git va boshqa yashirin fayllar ochiq bo'lmasin
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Build fayllari nomida hash bor: uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
